name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"

      - name: Run tests
        run: pytest

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: dividend-cli-windows
            executable_file: dividend-cli.exe
          - os: ubuntu-latest
            artifact_name: dividend-cli-linux
            executable_file: dividend-cli
          - os: macos-latest
            artifact_name: dividend-cli-macos
            executable_file: dividend-cli

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[build]"

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm dividend-cli.spec

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.executable_file }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List files
        run: find artifacts -type f

      - name: Extract changelog for this version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^## \[{re.escape(version)}\].*?(?=^## \[|\Z)"
          match = re.search(pattern, changelog, re.MULTILINE | re.DOTALL)

          if not match:
              raise SystemExit(f"Could not find CHANGELOG entry for version {version}")

          Path("release_notes.md").write_text(match.group(0).strip() + "\n", encoding="utf-8")
          PY

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            artifacts/dividend-cli-windows/dividend-cli.exe
            artifacts/dividend-cli-linux/dividend-cli
            artifacts/dividend-cli-macos/dividend-cli
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
