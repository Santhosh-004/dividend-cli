name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: dividend-cli-windows
            executable_name: dividend-cli.exe
          - os: ubuntu-latest
            artifact_name: dividend-cli-linux
            executable_name: dividend-cli
          - os: macos-latest
            artifact_name: dividend-cli-macos
            executable_name: dividend-cli

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install pyinstaller "pandas<3.0" click tabulate tqdm requests

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --console --name ${{ matrix.executable_name }} --distpath dist --workpath build run.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.executable_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List files
        run: find artifacts -type f

      - name: Extract changelog for this version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          awk -v ver="$VERSION" '/^## \['"$VERSION"'\]/,/^## \[/' CHANGELOG.md | head -n -1 > release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            artifacts/dividend-cli-windows/dividend-cli.exe
            artifacts/dividend-cli-linux/dividend-cli
            artifacts/dividend-cli-macos/dividend-cli
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
